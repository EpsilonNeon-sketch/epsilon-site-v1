<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epsilon Hub — We've Moved</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="https://epsilonhub.vercel.app/epsilon logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#09090b;color:#e4e4e7;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.25);border-radius:10px}

.bg-grid{position:fixed;inset:0;z-index:-2;background-image:radial-gradient(rgba(139,92,246,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.bg-glow{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(124,58,237,.14) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(139,92,246,.07) 0%,transparent 50%);pointer-events:none}

.container{max-width:560px;width:100%;padding:2rem 1.25rem;text-align:center;position:relative;z-index:1}

.logo-mark{width:72px;height:72px;border-radius:1.1rem;background:linear-gradient(135deg,#7c3aed,#8b5cf6);margin:0 auto 1.75rem;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#fff;box-shadow:0 12px 40px rgba(139,92,246,.3);animation:floatIn .8s cubic-bezier(.22,1,.36,1) both}

.new-url-box{background:rgba(20,20,30,.85);backdrop-filter:blur(20px);border:1.5px solid rgba(139,92,246,.2);border-radius:.85rem;padding:1rem 1.25rem;margin:1.75rem 0;display:flex;align-items:center;justify-content:space-between;gap:.75rem;animation:fadeUp .8s .25s cubic-bezier(.22,1,.36,1) both;cursor:pointer;transition:all .3s}
.new-url-box:hover{border-color:rgba(139,92,246,.4);box-shadow:0 0 24px rgba(139,92,246,.1)}
.new-url-box .url-text{font-size:.92rem;font-weight:600;color:#c4b5fd;letter-spacing:.01em;word-break:break-all}
.new-url-box .copy-icon{flex-shrink:0;width:36px;height:36px;border-radius:.5rem;background:rgba(139,92,246,.12);display:flex;align-items:center;justify-content:center;transition:all .2s}
.new-url-box:hover .copy-icon{background:rgba(139,92,246,.2)}
.new-url-box .copy-icon svg{color:#a78bfa;width:16px;height:16px}

.redirect-btn{display:inline-flex;align-items:center;gap:.55rem;padding:.85rem 2.2rem;border-radius:.75rem;background:linear-gradient(135deg,#7c3aed,#8b5cf6,#a78bfa);color:#fff;font-size:.95rem;font-weight:700;border:none;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;box-shadow:0 8px 32px rgba(139,92,246,.3);animation:fadeUp .8s .4s cubic-bezier(.22,1,.36,1) both;position:relative;overflow:hidden}
.redirect-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s}
.redirect-btn:hover::before{transform:translateX(100%)}
.redirect-btn:hover{transform:translateY(-2px);box-shadow:0 12px 44px rgba(139,92,246,.45)}
.redirect-btn:active{transform:translateY(0);box-shadow:0 4px 20px rgba(139,92,246,.3)}

.countdown-ring{width:44px;height:44px;position:relative;flex-shrink:0}
.countdown-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.countdown-ring circle{fill:none;stroke-width:3}
.countdown-ring .track{stroke:rgba(139,92,246,.15)}
.countdown-ring .progress{stroke:#8b5cf6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.countdown-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#a78bfa}

.old-url{font-size:.78rem;color:#3f3f46;margin-top:1.5rem;animation:fadeUp .8s .55s cubic-bezier(.22,1,.36,1) both;word-break:break-all}
.old-url span{text-decoration:line-through}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);padding:.7rem 1.25rem;border-radius:.65rem;color:#fff;font-weight:600;font-size:.82rem;box-shadow:0 8px 32px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:999;display:flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,#059669,#10b981)}
.toast.show{transform:translateX(-50%) translateY(0)}

@keyframes floatIn{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes subtlePulse{0%,100%{box-shadow:0 12px 40px rgba(139,92,246,.3)}50%{box-shadow:0 12px 56px rgba(139,92,246,.45)}}

@media(max-width:480px){
  .container{padding:1.5rem 1rem}
  .logo-mark{width:60px;height:60px;font-size:1.6rem;border-radius:.9rem}
  .new-url-box{flex-direction:column;text-align:center;padding:.85rem 1rem}
  .redirect-btn{width:100%;justify-content:center;padding:.8rem 1.5rem}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="container">
  <!-- Logo -->
  <div class="logo-mark" id="logoMark">ε</div>

  <!-- Heading -->
  <h1 style="font-size:1.65rem;font-weight:800;color:#e4e4e7;animation:fadeUp .8s .1s cubic-bezier(.22,1,.36,1) both;line-height:1.3">
    We've Moved
  </h1>
  <p style="font-size:.9rem;color:#71717a;margin-top:.6rem;line-height:1.65;animation:fadeUp .8s .15s cubic-bezier(.22,1,.36,1) both">
    Epsilon Hub has a new home.<br>Update your bookmarks — we're not here anymore.
  </p>

  <!-- New URL Box -->
  <div class="new-url-box" onclick="copyUrl()" title="Click to copy">
    <div>
      <div style="font-size:.65rem;font-weight:700;color:#52525b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">New Address</div>
      <div class="url-text">e-psilon.vercel.app</div>
    </div>
    <div class="copy-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    </div>
  </div>

  <!-- Redirect Button with Countdown -->
  <div style="display:flex;align-items:center;justify-content:center;gap:1rem;animation:fadeUp .8s .4s cubic-bezier(.22,1,.36,1) both">
    <button class="redirect-btn" onclick="goNow()" id="goBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Go to New Site
    </button>
    <div class="countdown-ring" id="countdownRing">
      <svg viewBox="0 0 44 44">
        <circle class="track" cx="22" cy="22" r="18"/>
        <circle class="progress" cx="22" cy="22" r="18" id="ringProgress"
          stroke-dasharray="113.1" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="countdownNum">15</div>
    </div>
  </div>

  <!-- Old URL strikethrough -->
  <p class="old-url">Old: <span>epsilonhub.vercel.app</span></p>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Copied!</span>
</div>

<script>
const NEW_URL = 'https://e-psilon.vercel.app';
const TOTAL_SECONDS = 15;
const CIRCUMFERENCE = 2 * Math.PI * 18; // ~113.1

let secondsLeft = TOTAL_SECONDS;
let countdownInterval = null;

function startCountdown() {
  const ring = document.getElementById('ringProgress');
  const num = document.getElementById('countdownNum');

  countdownInterval = setInterval(() => {
    secondsLeft--;
    num.textContent = secondsLeft;

    // Animate ring — offset goes from 0 to full circumference
    const offset = CIRCUMFERENCE * (1 - secondsLeft / TOTAL_SECONDS);
    ring.style.strokeDashoffset = offset;

    if (secondsLeft <= 3) {
      ring.style.stroke = '#f87171';
      num.style.color = '#f87171';
    }

    if (secondsLeft <= 0) {
      clearInterval(countdownInterval);
      goNow();
    }
  }, 1000);
}

function goNow() {
  if (countdownInterval) clearInterval(countdownInterval);
  window.location.href = NEW_URL;
}

function copyUrl() {
  navigator.clipboard.writeText(NEW_URL).then(() => {
    showToast('Link copied to clipboard!');
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = NEW_URL;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Link copied to clipboard!');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Subtle floating animation on the logo
const logo = document.getElementById('logoMark');
let t = 0;
function animateLogo() {
  t += 0.02;
  const y = Math.sin(t) * 4;
  const rot = Math.sin(t * 0.7) * 2;
  logo.style.transform = `translateY(${y}px) rotate(${rot}deg)`;
  requestAnimationFrame(animateLogo);
}
animateLogo();

// Start the countdown
startCountdown();
</script>
</body>
</html>
